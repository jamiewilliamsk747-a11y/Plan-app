<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PLAN — Your plans. Your discipline. Your progress.</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#090D16" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-main: #090D16;
      --bg-surface: #0F1624;
      --bg-card: #162033;
      --accent: #60D9A0;
      --accent-contrast: #072618;
      --text-main: #F3F5F8;
      --text-muted: #8E9BAE;
      --border-soft: rgba(255, 255, 255, 0.08);
      --highlight-top: rgba(255, 255, 255, 0.07);
    }
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background-color: var(--bg-main);
      color: var(--text-main);
      font-feature-settings: "cv02", "cv03", "cv04", "cv11";
      transition: background-color 0.4s cubic-bezier(0.16, 1, 0.3, 1), color 0.35s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .tabular-nums { font-variant-numeric: tabular-nums; }
    .lux-card {
      background: linear-gradient(165deg, color-mix(in srgb, var(--bg-card) 92%, white 8%) 0%, var(--bg-card) 100%);
      border: 1px solid var(--border-soft);
      box-shadow:
        0 20px 40px -20px rgba(0, 0, 0, 0.65),
        0 2px 6px -1px rgba(0, 0, 0, 0.3),
        inset 0 1px 0 var(--highlight-top);
      backdrop-filter: blur(18px);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.25s ease, box-shadow 0.3s ease, background 0.35s ease;
    }
    .lux-card-interactive:hover {
      transform: translateY(-2px);
      border-color: color-mix(in srgb, var(--accent) 40%, transparent);
      box-shadow:
        0 24px 48px -18px rgba(0, 0, 0, 0.75),
        0 0 0 1px color-mix(in srgb, var(--accent) 18%, transparent),
        inset 0 1px 0 rgba(255, 255, 255, 0.12);
    }
    .lux-sidebar {
      background: linear-gradient(180deg, var(--bg-surface) 0%, var(--bg-main) 100%);
      border-right: 1px solid var(--border-soft);
      transition: background 0.35s ease;
    }
    .lux-header {
      background: color-mix(in srgb, var(--bg-main) 78%, transparent);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border-soft);
    }
    .lux-input {
      background-color: color-mix(in srgb, var(--bg-main) 82%, black 18%);
      color: var(--text-main);
      border: 1px solid var(--border-soft);
      box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.25);
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }
    .lux-input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 20%, transparent), inset 0 1px 2px rgba(0, 0, 0, 0.2);
    }
    .lux-btn-primary {
      background: linear-gradient(135deg, var(--accent) 0%, color-mix(in srgb, var(--accent) 82%, black 18%) 100%);
      color: var(--accent-contrast);
      box-shadow: 0 8px 20px -6px color-mix(in srgb, var(--accent) 45%, transparent), inset 0 1px 0 rgba(255, 255, 255, 0.35);
      transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1), filter 0.2s ease, box-shadow 0.2s ease;
    }
    .lux-btn-primary:hover { filter: brightness(1.06); }
    .lux-btn-primary:active { transform: scale(0.96); }

    @keyframes viewSlideIn {
      from { opacity: 0; transform: translateY(14px) scale(0.985); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes cardStagger {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes barRise {
      from { transform: scaleY(0); opacity: 0.4; }
      to { transform: scaleY(1); opacity: 1; }
    }
    .animate-view { animation: viewSlideIn 0.38s cubic-bezier(0.16, 1, 0.3, 1) both; }
    .animate-stagger { animation: cardStagger 0.35s cubic-bezier(0.16, 1, 0.3, 1) both; }
    .bar-animate { transform-origin: bottom; animation: barRise 0.65s cubic-bezier(0.16, 1, 0.3, 1) both; }
    .ring-progress { transition: stroke-dashoffset 0.75s cubic-bezier(0.16, 1, 0.3, 1); }

    .drawer-backdrop { transition: opacity 0.28s ease; }
    .drawer-panel { transition: transform 0.34s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.28s ease; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="min-h-screen flex flex-col lg:flex-row overflow-x-hidden relative">

  <!-- Subtle Ambient Luxury Glow -->
  <div class="pointer-events-none fixed inset-0 overflow-hidden z-0">
    <div class="absolute -top-40 right-0 w-[420px] h-[420px] rounded-full blur-[120px] opacity-20" style="background: var(--accent)"></div>
    <div class="absolute bottom-0 -left-32 w-[360px] h-[360px] rounded-full blur-[120px] opacity-10" style="background: #6366f1"></div>
  </div>

  <!-- PC Sidebar Navigation -->
  <aside class="hidden lg:flex lg:flex-col lg:w-64 lg:shrink-0 lg:sticky lg:top-0 lg:h-screen lux-sidebar p-4 z-20">
    <div class="flex items-center justify-between px-2 mb-6">
      <div>
        <h1 class="text-2xl font-extrabold tracking-tight">PLAN<span style="color: var(--accent)">.</span></h1>
        <p class="text-[11px] tracking-wide" style="color: var(--text-muted)">Discipline &amp; Progress</p>
      </div>
      <button id="pc-quick-add-btn" type="button" class="w-9 h-9 rounded-xl flex items-center justify-center lux-btn-primary" title="Quick Add">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"/></svg>
      </button>
    </div>

    <nav id="pc-nav" class="flex-1 overflow-y-auto no-scrollbar flex flex-col gap-1"></nav>

    <div class="pt-3 mt-3 border-t flex items-center justify-between px-2 text-xs" style="border-color: var(--border-soft); color: var(--text-muted)">
      <span id="sidebar-user-label" class="font-medium">Eldad</span>
      <button id="sidebar-color-btn" type="button" class="inline-flex items-center gap-1.5 text-[11px] font-medium px-2 py-1 rounded-lg hover:bg-white/5 transition" style="color: var(--accent)">
        <span class="w-2 h-2 rounded-full" style="background: var(--accent)"></span>
        Theme
      </button>
    </div>
  </aside>

  <!-- Main Workspace -->
  <div class="flex-1 flex flex-col min-h-screen pb-24 lg:pb-10 relative z-10">
    <!-- Top Header -->
    <header class="sticky top-0 z-10 lux-header px-4 lg:px-8 py-4 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="lg:hidden">
          <h1 class="text-xl font-extrabold tracking-tight">PLAN<span style="color: var(--accent)">.</span></h1>
        </div>
        <div>
          <h2 id="page-title" class="text-base lg:text-lg font-bold tracking-tight leading-tight">Dashboard</h2>
          <p id="header-date" class="text-[11px] tracking-wide" style="color: var(--text-muted)"></p>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <!-- Always-Accessible Formal Color Studio Trigger -->
        <button id="header-color-btn" type="button" class="px-3 py-2 rounded-xl border text-xs font-medium flex items-center gap-1.5 active:scale-95 transition" style="border-color: var(--border-soft); background: var(--bg-card)" title="Color & Theme Studio">
          <span class="w-2.5 h-2.5 rounded-full ring-2 ring-white/20" style="background: var(--accent)"></span>
          <span class="hidden sm:inline">Colors</span>
        </button>

        <button id="mobile-quick-add-btn" type="button" class="lg:hidden px-3 py-2 rounded-xl text-xs font-semibold flex items-center gap-1 lux-btn-primary">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"/></svg>
          Add
        </button>
      </div>
    </header>

    <!-- Dynamic View Container -->
    <main id="main-content" class="flex-1 px-4 lg:px-8 py-6 max-w-6xl w-full mx-auto"></main>
  </div>

  <!-- Mobile Bottom Navigation -->
  <nav class="lg:hidden fixed bottom-2.5 left-1/2 -translate-x-1/2 w-[calc(100%-1rem)] max-w-md z-30 lux-card rounded-2xl px-1.5 py-1.5 grid grid-cols-5 gap-1">
    <button type="button" data-nav="dashboard" class="mob-nav-btn flex flex-col items-center py-1.5 rounded-xl text-[10px] font-medium transition"></button>
    <button type="button" data-nav="tasks" class="mob-nav-btn flex flex-col items-center py-1.5 rounded-xl text-[10px] font-medium transition"></button>
    <button type="button" data-nav="habits" class="mob-nav-btn flex flex-col items-center py-1.5 rounded-xl text-[10px] font-medium transition"></button>
    <button type="button" data-nav="study" class="mob-nav-btn flex flex-col items-center py-1.5 rounded-xl text-[10px] font-medium transition"></button>
    <button type="button" id="mob-more-btn" class="flex flex-col items-center py-1.5 rounded-xl text-[10px] font-medium transition" style="color: var(--text-muted)">
      <svg class="w-4 h-4 mb-0.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5"/></svg>
      <span>More</span>
    </button>
  </nav>

  <!-- Mobile More Drawer -->
  <div id="more-drawer" class="fixed inset-0 z-40 hidden">
    <div id="more-backdrop" class="absolute inset-0 bg-black/65 backdrop-blur-sm drawer-backdrop opacity-0"></div>
    <div id="more-panel" class="absolute bottom-0 left-0 right-0 lux-card rounded-t-3xl p-5 max-h-[82vh] overflow-y-auto drawer-panel translate-y-full">
      <div class="flex items-center justify-between mb-4">
        <h3 class="text-base font-bold tracking-tight">All Modules</h3>
        <button id="close-more-btn" type="button" class="p-1.5 rounded-lg" style="color: var(--text-muted)">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>
      <div id="more-grid" class="grid grid-cols-3 gap-2.5"></div>
    </div>
  </div>

  <!-- Formal Color Studio Drawer (Accessible Anytime) -->
  <div id="color-drawer" class="fixed inset-0 z-50 hidden">
    <div id="color-backdrop" class="absolute inset-0 bg-black/65 backdrop-blur-sm drawer-backdrop opacity-0"></div>
    <div id="color-panel" class="absolute right-0 top-0 bottom-0 w-full max-w-sm lux-card p-6 overflow-y-auto drawer-panel translate-x-full flex flex-col gap-5">
      <div class="flex items-center justify-between">
        <div>
          <span class="text-[10px] uppercase tracking-widest font-semibold" style="color: var(--accent)">Appearance Studio</span>
          <h3 class="text-lg font-bold tracking-tight">Formal Color Correction</h3>
        </div>
        <button id="close-color-btn" type="button" class="p-1.5 rounded-xl border" style="border-color: var(--border-soft); color: var(--text-muted)">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>

      <div>
        <p class="text-xs font-semibold mb-2.5" style="color: var(--text-muted)">Curated Formal Palettes</p>
        <div id="preset-grid" class="grid grid-cols-1 gap-2"></div>
      </div>

      <div class="border-t pt-4 flex flex-col gap-3" style="border-color: var(--border-soft)">
        <p class="text-xs font-semibold" style="color: var(--text-muted)">Custom Fine-Tuning</p>
        <label class="flex items-center justify-between text-xs font-medium">
          <span>Background</span>
          <input id="cp-bg" type="color" class="w-10 h-8 rounded-lg border-0 bg-transparent cursor-pointer" />
        </label>
        <label class="flex items-center justify-between text-xs font-medium">
          <span>Cards &amp; Surfaces</span>
          <input id="cp-card" type="color" class="w-10 h-8 rounded-lg border-0 bg-transparent cursor-pointer" />
        </label>
        <label class="flex items-center justify-between text-xs font-medium">
          <span>Primary Accent</span>
          <input id="cp-accent" type="color" class="w-10 h-8 rounded-lg border-0 bg-transparent cursor-pointer" />
        </label>
        <label class="flex items-center justify-between text-xs font-medium">
          <span>Text Color</span>
          <input id="cp-text" type="color" class="w-10 h-8 rounded-lg border-0 bg-transparent cursor-pointer" />
        </label>
      </div>

      <button id="reset-colors-btn" type="button" class="mt-auto w-full py-2.5 rounded-xl text-xs font-semibold border active:scale-95 transition" style="border-color: var(--border-soft)">
        Reset to Default PLAN Palette
      </button>
    </div>
  </div>

  <!-- Quick Add Modal -->
  <div id="quick-modal" class="fixed inset-0 z-50 hidden items-center justify-center p-4">
    <div id="quick-backdrop" class="absolute inset-0 bg-black/65 backdrop-blur-sm drawer-backdrop opacity-0"></div>
    <div id="quick-panel" class="relative w-full max-w-md lux-card rounded-2xl p-5 drawer-panel scale-95 opacity-0">
      <div class="flex items-center justify-between mb-4">
        <h3 class="text-base font-bold tracking-tight">Quick Add to PLAN</h3>
        <button id="close-quick-btn" type="button" class="p-1 rounded-lg" style="color: var(--text-muted)">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="flex flex-col gap-3">
        <select id="quick-type" class="lux-input rounded-xl px-3 py-2.5 text-sm">
          <option value="task">Daily Task</option>
          <option value="habit">Habit</option>
          <option value="goal">Goal</option>
          <option value="note">Note</option>
          <option value="reminder">Reminder</option>
        </select>
        <input id="quick-title" type="text" placeholder="Title or name..." class="lux-input rounded-xl px-3 py-2.5 text-sm" />
        <input id="quick-extra" type="text" placeholder="Optional detail (category, deadline, or note)..." class="lux-input rounded-xl px-3 py-2.5 text-sm" />
        <button id="quick-save-btn" type="button" class="w-full py-2.5 rounded-xl font-semibold text-sm lux-btn-primary">Save Item</button>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="fixed top-5 left-1/2 -translate-x-1/2 z-50 px-4 py-2 rounded-xl lux-card text-xs font-semibold shadow-2xl opacity-0 pointer-events-none transition-all duration-300"></div>

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) state = { ...defaultState(), ...JSON.parse(raw) };
      } catch (e) {
        state = defaultState();
      }
    }

    function saveState() {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
    }

    function applyColors() {
      const c = state.colors || FORMAL_PALETTES[0];
      const r = document.documentElement.style;
      r.setProperty("--bg-main", c.bg);
      r.setProperty("--bg-surface", c.surface || c.bg);
      r.setProperty("--bg-card", c.card);
      r.setProperty("--accent", c.accent);
      r.setProperty("--accent-contrast", c.contrast || "#072618");
      r.setProperty("--text-main", c.text);
      r.setProperty("--text-muted", c.muted || (c.light ? "#475569" : "#8E9BAE"));
      r.setProperty("--border-soft", c.light ? "rgba(15, 23, 42, 0.1)" : "rgba(255, 255, 255, 0.08)");
      r.setProperty("--highlight-top", c.light ? "rgba(255, 255, 255, 0.9)" : "rgba(255, 255, 255, 0.07)");

      const cpBg = document.getElementById("cp-bg");
      const cpCard = document.getElementById("cp-card");
      const cpAcc = document.getElementById("cp-accent");
      const cpTxt = document.getElementById("cp-text");
      if (cpBg) cpBg.value = c.bg;
      if (cpCard) cpCard.value = c.card;
      if (cpAcc) cpAcc.value = c.accent;
      if (cpTxt) cpTxt.value = c.text;
    }

    function showToast(msg) {
      const el = document.getElementById("toast");
      el.textContent = msg;
      el.classList.remove("opacity-0", "-translate-y-2");
      el.classList.add("opacity-100", "translate-y-0");
      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        el.classList.remove("opacity-100", "translate-y-0");
        el.classList.add("opacity-0", "-translate-y-2");
      }, 2000);
    }

      const total = state.tasks.length + state.habits.length;
      if (total === 0) return 0;
      const done = state.tasks.filter((t) => t.done).length + state.habits.filter((h) => h.doneToday).length;
      return Math.round((done / total) * 100);
    }

    function renderCategories(main) {
      main.innerHTML = `
        <div class="animate-view flex flex-col gap-4">
          <form id="cat-form" class="lux-card rounded-2xl p-4 flex gap-2.5">
            <input id="c-name" type="text" placeholder="New category name..." required class="lux-input flex-1 rounded-xl px-3 py-2.5 text-sm" />
            <input id="c-color" type="color" value="#60D9A0" class="w-11 h-10 rounded-xl border-0 bg-transparent cursor-pointer" />
            <button type="submit" class="rounded-xl py-2.5 px-4 text-sm font-semibold lux-btn-primary">Add</button>
          </form>
          <div class="grid grid-cols-2 sm:grid-cols-3 gap-3">
            ${state.categories.map((c, idx) => `
              <div class="lux-card lux-card-interactive animate-stagger rounded-2xl p-4 flex items-center justify-between" style="animation-delay: ${idx * 40}ms">
                <div class="flex items-center gap-2.5">
                  <span class="w-3.5 h-3.5 rounded-full shrink-0" style="background: ${c.color}"></span>
                  <span class="text-sm font-semibold">${c.name}</span>
                </div>
                <button type="button" data-del-cat="${c.id}" class="text-xs text-rose-400">×</button>
              </div>
            `).join("")}
          </div>
        </div>`;
      document.getElementById("cat-form").addEventListener("submit", (e) => {
        e.preventDefault();
        state.categories.push({ id: Date.now(), name: document.getElementById("c-name").value.trim(), color: document.getElementById("c-color").value });
        saveState();
        showToast("Category added");
        renderAll();
      });
      main.querySelectorAll("[data-del-cat]").forEach(b => b.addEventListener("click", () => {
        state.categories = state.categories.filter(x => x.id !== Number(b.dataset.delCat));
        saveState();
        renderAll();
      }));
    }

    function renderCustom(main) {
      main.innerHTML = `
        <div class="animate-view flex flex-col gap-4">
          <form id="cust-form" class="lux-card rounded-2xl p-4 grid grid-cols-1 sm:grid-cols-12 gap-2.5">
            <input id="cu-name" type="text" placeholder="Custom tracker name (e.g. Reading, Finance)..." required class="lux-input sm:col-span-4 rounded-xl px-3 py-2.5 text-sm" />
            <input id="cu-desc" type="text" placeholder="Description..." required class="lux-input sm:col-span-4 rounded-xl px-3 py-2.5 text-sm" />
            <select id="cu-freq" class="lux-input sm:col-span-2 rounded-xl px-2.5 py-2.5 text-sm">
              <option>Daily</option>
              <option>Weekly</option>
            </select>
            <button type="submit" class="sm:col-span-2 rounded-xl py-2.5 px-3 text-sm font-semibold lux-btn-primary">Create</button>
          </form>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-3.5">
            ${state.customItems.map((ci, idx) => `
              <div class="lux-card lux-card-interactive animate-stagger rounded-2xl p-4 flex items-center justify-between" style="animation-delay: ${idx * 45}ms">
                <div>
                  <h4 class="text-sm font-bold">${ci.name}</h4>
                  <p class="text-xs" style="color: var(--text-muted)">${ci.desc} · ${ci.freq}</p>
                </div>
                <button type="button" data-inc-cust="${ci.id}" class="px-3.5 py-1.5 rounded-xl text-xs font-bold tabular-nums lux-btn-primary">+1 (${ci.count})</button>
              </div>
            `).join("")}
          </div>
        </div>`;
      document.getElementById("cust-form").addEventListener("submit", (e) => {
        e.preventDefault();
        state.customItems.unshift({
          id: Date.now(),
          name: document.getElementById("cu-name").value.trim(),
          desc: document.getElementById("cu-desc").value.trim(),
          freq: document.getElementById("cu-freq").value,
          count: 0
        });
        saveState();
        showToast("Custom tracker created");
        renderAll();
      });
      main.querySelectorAll("[data-inc-cust]").forEach(b => b.addEventListener("click", () => {
        const ci = state.customItems.find(x => x.id === Number(b.dataset.incCust));
        if (ci) { ci.count++; saveState(); renderAll(); }
      }));
    }

    function renderAnalytics(main) {
      const studyMins = state.studySessions.reduce((a, b) => a + b.minutes, 0);
      main.innerHTML = `
        <div class="animate-view grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
          ${[
            { label: "Daily Completion Rate", val: `${calcDailyProgress()}%`, accent: true },
            { label: "Total Study Planned", val: `${(studyMins / 60).toFixed(1)} hrs` },
            { label: "Workouts Logged", val: state.workouts.length },
            { label: "Active Habits", val: state.habits.length },
            { label: "Missed Commitments", val: state.discipline.length },
            { label: "Custom Trackers", val: state.customItems.length }
          ].map((c, idx) => `
            <div class="lux-card animate-stagger rounded-2xl p-5" style="animation-delay: ${idx * 45}ms">
              <div class="text-xs uppercase tracking-wider font-semibold" style="color: var(--text-muted)">${c.label}</div>
              <div class="text-3xl font-extrabold tabular-nums mt-2" style="${c.accent ? "color: var(--accent)" : ""}">${c.val}</div>
            </div>
          `).join("")}
        </div>`;
    }

    function renderSettings(main) {
      main.innerHTML = `
        <div class="animate-view flex flex-col gap-4 max-w-xl">
          <div class="lux-card rounded-2xl p-5 flex flex-col gap-3">
            <h3 class="text-sm font-bold">Profile Settings</h3>
            <div class="flex gap-2">
              <input id="set-name" type="text" value="${state.userName}" class="lux-input flex-1 rounded-xl px-3 py-2.5 text-sm" />
              <button id="save-name-btn" type="button" class="px-4 py-2.5 rounded-xl text-sm font-semibold lux-btn-primary">Save</button>
            </div>
          </div>
          <div class="lux-card rounded-2xl p-5 flex items-center justify-between">
            <div>
              <h3 class="text-sm font-bold">Formal Color Correction</h3>
              <p class="text-xs" style="color: var(--text-muted)">Open the Appearance Studio anytime to customize colors</p>
            </div>
            <button id="open-studio-set-btn" type="button" class="px-4 py-2 rounded-xl text-xs font-semibold lux-btn-primary">Open Studio</button>
          </div>
          <div class="lux-card rounded-2xl p-5 flex items-center justify-between">
            <div>
              <h3 class="text-sm font-bold">Reset Demo Data</h3>
              <p class="text-xs" style="color: var(--text-muted)">Restore default PLAN starter records</p>
            </div>
            <button id="reset-data-btn" type="button" class="px-4 py-2 rounded-xl text-xs font-semibold bg-rose-500/15 text-rose-400 active:scale-95 transition">Reset</button>
          </div>
        </div>`;

      document.getElementById("save-name-btn").addEventListener("click", () => {
        state.userName = document.getElementById("set-name").value.trim() || "Eldad";
        saveState();
        showToast("Profile updated");
        renderAll();
      });
      document.getElementById("open-studio-set-btn").addEventListener("click", openColorDrawer);
      document.getElementById("reset-data-btn").addEventListener("click", () => {
        state = defaultState();
        saveState();
        applyColors();
        showToast("Data reset");
        renderAll();
      });
    }

    function renderAll() {
      applyColors();
      renderNavigation();
      document.getElementById("sidebar-user-label").textContent = state.userName;
      const currentItem = NAV_ITEMS.find((i) => i.id === state.activeTab) || NAV_ITEMS[0];
      document.getElementById("page-title").textContent = currentItem.label;
      document.getElementById("header-date").textContent = new Date().toLocaleDateString("en-US", {
        weekday: "long", month: "short", day: "numeric", year: "numeric"
      });

      const main = document.getElementById("main-content");
      const views = {
        dashboard: renderDashboard,
        tasks: renderTasks,
        goals: renderGoals,
        workout: renderWorkout,
        study: renderStudy,
        habits: renderHabits,
        notes: renderNotes,
        discipline: renderDiscipline,
        reminders: renderReminders,
        categories: renderCategories,
        custom: renderCustom,
        analytics: renderAnalytics,
        settings: renderSettings
      };
      (views[state.activeTab] || renderDashboard)(main);
    }

    document.getElementById("header-color-btn").addEventListener("click", openColorDrawer);
    document.getElementById("sidebar-color-btn").addEventListener("click", openColorDrawer);
    document.getElementById("color-backdrop").addEventListener("click", closeColorDrawer);
    document.getElementById("close-color-btn").addEventListener("click", closeColorDrawer);

    ["cp-bg", "cp-card", "cp-accent", "cp-text"].forEach((id) => {
      document.getElementById(id).addEventListener("input", (e) => {
        state.colors.id = "custom";
        if (id === "cp-bg") { state.colors.bg = e.target.value; state.colors.surface = e.target.value; }
        if (id === "cp-card") state.colors.card = e.target.value;
        if (id === "cp-accent") state.colors.accent = e.target.value;
        if (id === "cp-text") state.colors.text = e.target.value;
        saveState();
        applyColors();
        renderPresets();
      });
    });

    document.getElementById("reset-colors-btn").addEventListener("click", () => {
      state.colors = { ...FORMAL_PALETTES[0] };
      saveState();
      applyColors();
      renderPresets();
      renderAll();
      showToast("Default colors restored");
    });

    document.getElementById("mob-more-btn").addEventListener("click", openMoreDrawer);
    document.getElementById("more-backdrop").addEventListener("click", closeMoreDrawer);
    document.getElementById("close-more-btn").addEventListener("click", closeMoreDrawer);
    document.getElementById("pc-quick-add-btn").addEventListener("click", openQuickModal);
    document.getElementById("mobile-quick-add-btn").addEventListener("click", openQuickModal);
    document.getElementById("quick-backdrop").addEventListener("click", closeQuickModal);
    document.getElementById("close-quick-btn").addEventListener("click", closeQuickModal);

    document.getElementById("quick-save-btn").addEventListener("click", () => {
      const type = document.getElementById("quick-type").value;
      const title = document.getElementById("quick-title").value.trim();
      const extra = document.getElementById("quick-extra").value.trim();
      if (!title) return;
      if (type === "task") state.tasks.unshift({ id: Date.now(), title, priority: "medium", category: extra || "Personal", date: "Today", done: false });
      if (type === "habit") state.habits.unshift({ id: Date.now(), name: title, freq: extra || "Daily", streak: 0, doneToday: false });
      if (type === "goal") state.goals.unshift({ id: Date.now(), title, type: "Short-term", deadline: extra, progress: 0 });
      if (type === "note") state.notes.unshift({ id: Date.now(), title, folder: "Personal", body: extra || title, pinned: false });
      if (type === "reminder") state.reminders.unshift({ id: Date.now(), title, time: extra || "Today", repeat: "Once", enabled: true });
      document.getElementById("quick-title").value = "";
      document.getElementById("quick-extra").value = "";
      saveState();
      closeQuickModal();
      showToast("Added to PLAN");
      renderAll();
    });

    loadState();
    renderAll();
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js").catch(() => {});
      });
    }
  </script>
</body>
</html>
